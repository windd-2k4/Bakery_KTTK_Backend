version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bakery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakery_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bakery_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB:-bakery_db} -U ${POSTGRES_USER:-bakery_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery_network

  redis:
    image: redis:7-alpine
    container_name: bakery_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bakery_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bakery_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-bakery_pass}
      RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bakery_network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: bakery_api_gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DOCKER_ENV: 'true'
      PAYMENT_SERVICE_URL: http://payment-service:3004
      PRODUCT_SERVICE_URL: http://product-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - '3000:3000'
    depends_on:
      - payment-service
      - auth-service
      - notification-service
    networks:
      - bakery_network

  auth-service:
    build:
      context: ./services/auth-service
    container_name: bakery_auth_service
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-bakery_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bakery_pass}
      DB_DATABASE: ${POSTGRES_DB:-bakery_db}
      DATABASE_URL: postgresql://bakery_user:bakery_pass@postgres:5432/bakery_db
      RABBITMQ_URL: amqp://bakery_user:bakery_pass@rabbitmq:5672
      RABBITMQ_NOTIFICATION_QUEUE: bakery.notification.queue
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - bakery_network

  payment-service:
    build:
      context: ./services/payment-service
    container_name: bakery_payment_service
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-bakery_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bakery_pass}
      DB_DATABASE: ${POSTGRES_DB:-bakery_db}
      DATABASE_URL: postgresql://bakery_user:bakery_pass@postgres:5432/bakery_db
      ORDER_SERVICE_URL: http://order-service:3003
      RABBITMQ_URL: amqp://bakery_user:bakery_pass@rabbitmq:5672
      RABBITMQ_PAYMENT_EXCHANGE: bakery.events
      RABBITMQ_PAYMENT_QUEUE: bakery.payment.queue
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CHECKOUT_BASE_URL: ${STRIPE_CHECKOUT_BASE_URL:-https://checkout.stripe.com/c/pay}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_WEBHOOK_TOKEN: ${SEPAY_WEBHOOK_TOKEN:-}
      SEPAY_ACCOUNT_NO: ${SEPAY_ACCOUNT_NO:-0123456789}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-BAKERY KTTK}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-970422}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3004/payments/api/callback/vnpay}
    ports:
      - '3004:3004'
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - bakery_network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: bakery_notification_service
    restart: unless-stopped
    environment:
      PORT: 3008
      NODE_ENV: ${NODE_ENV:-development}
      RABBITMQ_URL: amqp://bakery_user:bakery_pass@rabbitmq:5672
      RABBITMQ_NOTIFICATION_QUEUE: bakery.notification.queue
      RABBITMQ_EXCHANGE: bakery.events
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-phong20040610a4@gmail.com}
      MAIL_PASS: ${MAIL_PASS:-your_google_app_password_here}
      MAIL_FROM: ${MAIL_FROM:-"SweetBakery Security" <phong20040610a4@gmail.com>}
    ports:
      - '3008:3008'
    depends_on:
      - rabbitmq
    networks:
      - bakery_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  bakery_network:
    driver: bridge
